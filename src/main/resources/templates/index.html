
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Management System</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f4f7;
            margin: 30px;
        }

        h1 {
            text-align: center;
            color: #243b55;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 1000px;
            margin: auto;
        }

        input {
            padding: 10px;
            margin: 7px;
            width: 180px;
        }

        button {
            padding: 10px 20px;
            background: #243b55;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #243b55;
            color: white;
        }

        a {
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Employee Management System</h1>

    <h2>Add Employee</h2>

    <form th:action="@{/save}" th:object="${employee}" method="post">

        <input type="hidden" th:field="*{id}">

        <input type="text" th:field="*{name}"
               placeholder="Employee Name" required>

        <input type="email" th:field="*{email}"
               placeholder="Email" required>

        <input type="text" th:field="*{department}"
               placeholder="Department" required>

        <input type="number" step="0.01" th:field="*{salary}"
               placeholder="Salary" required>

        <button type="submit">Save Employee</button>

    </form>

    <p th:text="${message}"></p>

    <h2>Employee Records</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.name}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.salary}"></td>
                <td>
                    <a th:href="@{/edit/{id}(id=${emp.id})}">Edit</a>
                    <a th:href="@{/delete/{id}(id=${emp.id})}"
                       onclick="return confirm('Delete this employee?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
